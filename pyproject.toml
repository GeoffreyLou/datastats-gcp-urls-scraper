[project]
name = "urls_scraper"
version = "1.0.0"
description = "Cloud Run to scrape jobs urls from a website."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru",
    "selenium",
    "fake-useragent",
    "beautifulsoup4",
    "pandas",
    "python-dotenv",
    "google-cloud-storage",
    "google-cloud-bigquery",
    "google-cloud-logging"
]

[dependency-groups]
dev = [
    "pytest",
]
